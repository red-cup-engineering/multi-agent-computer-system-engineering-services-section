# mash instance manifest.
#
# `mash up` reads this file to decide which owner-agents to embed in the
# hub and which port subprocesses to spawn. The default search order is
#
#   $MASH_ROOT/manifest.toml   (instance-local override)
#   ./mash.toml                (workspace default; this file)
#
# `crate` / `bin` strings resolve against a compile-time registry in
# mash-cli; adding a new owner-agent or port binary requires both listing
# it here AND adding it to the registry.
#
# Each port subprocess is launched from the same directory `mash` itself
# lives in (target/debug or target/release under normal cargo builds),
# with MASH_SOCKET set automatically. Further env vars pass through the
# per-entry `env = { ... }` table.

[hub]

# ─────────────────────────────────────────────────────────────────────
# Owner-agent vocabularies embedded in the hub process. Order is the
# claims-mount order at boot.
# ─────────────────────────────────────────────────────────────────────

[[vocab]]
crate = "mash-vocab-core"

[[vocab]]
crate = "mash-vocab-lifecycle"

[[vocab]]
crate = "mash-vocab-comms"

[[vocab]]
crate = "mash-vocab-mud-session"

[[vocab]]
crate = "mash-vocab-intent"

[[vocab]]
crate = "mash-vocab-dispatch"

[[vocab]]
crate = "mash-vocab-ops"

[[vocab]]
crate = "mash-vocab-task"

[[vocab]]
crate = "mash-vocab-approval"

[[vocab]]
crate = "mash-vocab-workers"

[[vocab]]
crate = "mash-vocab-learning"

[[vocab]]
crate = "mash-vocab-correlation"

[[vocab]]
crate = "mash-vocab-settlement"

[[vocab]]
crate = "mash-vocab-choreography"

[[vocab]]
crate = "mash-vocab-grammar"

[[vocab]]
crate = "mash-vocab-capability"

[[vocab]]
crate = "mash-vocab-command"

[[vocab]]
crate = "mash-vocab-mud-verbs"

[[vocab]]
crate = "mash-vocab-accounting"

[[vocab]]
crate = "mash-vocab-mud-movement"

[[vocab]]
crate = "mash-vocab-mud-space"

[[vocab]]
crate = "mash-vocab-mud-lore"

[[vocab]]
crate = "mash-vocab-mud-timeline"

[[vocab]]
crate = "mash-vocab-mud-extras"

[[vocab]]
crate = "mash-vocab-mud-beastiary"

# ─────────────────────────────────────────────────────────────────────
# Scene data — instance claims layered on top of the vocabularies.
# ─────────────────────────────────────────────────────────────────────

[[scene]]
crate = "mash-scene-mud-teraum"

# ─────────────────────────────────────────────────────────────────────
# Port subprocesses. Each is an independent binary that connects back
# to the hub over MASH_SOCKET.
# ─────────────────────────────────────────────────────────────────────

[[port]]
bin = "mash-port-conduit-mud-telnet"
env = { MASH_TELNET_PORT = "4242" }

[[port]]
