[[port]]
bin = "mash-port-projection-resolver-string-rest"

[[port]]
bin = "mash-port-projection-resolver-literal-string"

[[port]]
bin = "mash-port-projection-rule-environment"

[[port]]
bin = "mash-port-projection-rule-capability"

[[port]]
bin = "mash-port-projection-rule-state"

[[port]]
bin = "mash-port-projection-run-dispatcher"

[[port]]
bin = "mash-port-projection-mud-command-quit"

[[port]]
bin = "mash-port-projection-mud-disposition"

[[port]]
bin = "mash-port-projection-mud-space-look"

[[port]]
