[package]
name         = "mash-library"
description  = "MASH library: thing-ness, objects, qualities, relations, acts — OQRA-structured content over the mash-engine substrate."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[lints]
workspace = true

[dependencies]
mash-engine        = { workspace = true }
async-trait        = { workspace = true }
anyhow             = { workspace = true }
serde_json         = { workspace = true }
sha2               = "0.10"
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "mash-conduit-stdio"
path = "src/bin/conduit_stdio.rs"

[[bin]]
name = "mash-conduit-telnet"
path = "src/bin/conduit_telnet.rs"

[[bin]]
name = "mash"
path = "src/bin/mash_cli.rs"

[[bin]]
name = "mash-sensor-file"
path = "src/bin/sensor_file.rs"

[[bin]]
name = "mash-effector-shell"
path = "src/bin/effector_shell.rs"

[[bin]]
name = "mash-effector-container"
path = "src/bin/effector_container.rs"

[[bin]]
name = "mash-effector-llm"
path = "src/bin/effector_llm.rs"
